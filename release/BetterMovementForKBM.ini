; Better Movement for KBM controls
;
; Sensitivity ranges from 0 to 100. The default is 50.
; Lower values create smaller movement-speed changes per wheel notch.
; Higher values create larger movement-speed changes per wheel notch.
;
; Accepted shortcut names:
; F1-F24, A-Z, 0-9, Home, End, Insert, Delete, PageUp, PageDown,
; Up, Down, Left, Right, Tab, CapsLock, Numpad+, and Numpad-.
; Each sensitivity action must use a different key.

[Controls]
Sensitivity=50
SensitivityDecreaseKey=F6
SensitivityDisplayKey=F7
SensitivityIncreaseKey=F8
